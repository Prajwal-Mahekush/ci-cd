<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Task List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>My Task List</h1>

        <ul class="task-list">
            {% for task in tasks %}
                <li>{{ task }}</li>
            {% endfor %}
        </ul>

        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="Add a new task" required>
            <button type="submit">Add</button>
        </form>
    </div>
</body>
</html>
